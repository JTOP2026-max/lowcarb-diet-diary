<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f8f3"><title>每日低碳飲食日記</title><style>:root{--g:#287447;--bg:#f4f7f3;--line:#dce5dd;--muted:#69766d;--soft:#f7fbf8;--blue:#eef6ff;--ink:#203027}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}.app{max-width:900px;margin:auto;padding:18px 14px 80px}h1{font-size:25px;margin:4px 0}h2{font-size:19px}p{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 28px #25452d0b}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.m{background:#fafcfa;border:1px solid var(--line);border-radius:13px;padding:11px}.m b{font-size:22px}.m small{display:block;color:var(--muted)}button,.pick{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}.primary,.pick{background:var(--g);color:#fff}.pick.alt{background:#edf3ff;color:#27577e;border:1px solid #cbdced}.chat{background:#111;color:#fff}.secondary{background:#edf2ee}.add{width:100%;background:var(--soft);border:1px dashed #9dbba6;color:var(--g)}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd8ce;border-radius:10px;font:inherit;background:#fff}label{font-size:13px;color:var(--muted);display:block;margin:8px 0 4px}.meal{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);padding:10px;border-radius:14px;margin:8px 0}.meal img{width:86px;height:72px;object-fit:cover;border-radius:10px}.meal h3,.meal p{margin:2px 0}.danger{background:none;color:#a33}.feedback{margin:8px 0 14px 96px;background:#fbfdfb;border:1px solid var(--line);border-radius:14px;padding:12px;line-height:1.65;font-size:14px}.chatbox{background:#f7fbff;border:1px solid #cfe1f3;border-radius:14px;padding:12px;margin-top:10px;line-height:1.65}.small{font-size:12px;color:var(--muted)}dialog{width:min(640px,calc(100% - 20px));border:0;border-radius:18px;padding:0}dialog::backdrop{background:#13231966}.modal{padding:17px}.photo{text-align:center;border:1px dashed #9dbba6;border-radius:13px;padding:12px}.photo img{width:100%;max-height:260px;object-fit:cover;border-radius:10px;display:none;margin-bottom:10px}.photo input{display:none}.photoActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:14px}.water button{margin:3px;background:#eef4ef}.water button.on{background:#bfe1c8}.hint{background:var(--blue);border:1px solid #d8e7f6;border-radius:12px;padding:10px;margin-top:10px;color:#36596f}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2d24;color:#fff;padding:10px 14px;border-radius:999px;display:none;z-index:10}@media(max-width:600px){.meal{grid-template-columns:72px 1fr}.meal img{width:72px;height:62px}.meal .danger{grid-column:2}.metrics{grid-template-columns:repeat(3,1fr)}.feedback{margin-left:0}.photoActions{grid-template-columns:1fr}}</style></head><body><main class="app"><h1>🥗 每日低碳飲食日記</h1><p id="date"></p><div class="metrics"><div class="m"><b id="cnt">0</b><small>今日餐次</small></div><div class="m"><b id="avg">--</b><small>低碳自評</small></div><div class="m"><b id="wc">0</b><small>杯水</small></div></div><section class="card"><h2>今日餐點</h2><div id="list"></div><button class="add" id="add">＋ 新增一餐</button></section><section class="card"><h2>💧 喝水</h2><div class="water" id="water"></div></section><section class="card"><h2>🤖 ChatGPT Plus 輔助方式</h2><div class="chatbox">網站本身不串付費 API。每餐可先拍照或選圖，再按「交給 ChatGPT 分析」。手機會開分享選單，請選 ChatGPT；如果裝置不支援直接分享照片，就會自動複製分析提示，你再到 ChatGPT 上傳同一張照片即可。</div><p class="small">這樣可以直接使用你已有的 ChatGPT 帳號，不另外產生 API 費用。</p></section></main><dialog id="dlg"><div class="modal"><h2>新增餐點</h2><form id="form"><div class="photo"><img id="preview"><div class="photoActions"><label class="pick" for="camera">📷 直接拍照</label><label class="pick alt" for="gallery">🖼️ 從圖庫選照片</label></div><input id="camera" type="file" accept="image/*" capture="environment"><input id="gallery" type="file" accept="image/*"><div class="small" id="photoMsg">照片會自動壓縮後儲存在這台裝置。</div></div><label>餐別</label><select id="type"><option>早餐</option><option>午餐</option><option>晚餐</option><option>點心</option><option>飲料</option></select><label>我知道的內容（可空白）</label><textarea id="foods" rows="3" placeholder="例：飲料是無糖豆漿；那塊不是吐司，是地瓜。"></textarea><div class="hint">建議先不用勉強形容。照片選好後直接按「交給 ChatGPT 分析」，AI 先幫你辨識；看錯或漏掉的部分，再回來補充即可。</div><label>ChatGPT 回覆重點（可貼回保存）</label><textarea id="aiNote" rows="5" placeholder="可把 ChatGPT 的分析重點貼回來，例如：看起來有全麥吐司、蛋、藍莓、草莓；蛋白質略少，午餐補肉/魚/豆腐與蔬菜。"></textarea><div class="actions"><button type="button" class="chat" id="shareAI">✨ 交給 ChatGPT 分析</button><button type="button" class="secondary" id="copyPrompt">複製分析提示</button><button type="button" class="secondary" id="cancel">取消</button><button class="primary" type="submit">儲存餐點</button></div></form></div></dialog><div class="toast" id="toast"></div><script>const DAY=new Date().toLocaleDateString('sv-SE'),META='lowcarb_plus_meta',DB='lowcarb_plus_photos';let meta=JSON.parse(localStorage.getItem(META)||'{"meals":{},"water":{}}'),blob=null;const $=s=>document.querySelector(s);$('#date').textContent=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'});function toast(t){let x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}function db(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function put(k,v){let d=await db();return new Promise((ok,no)=>{let t=d.transaction('photos','readwrite');t.objectStore('photos').put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})}async function get(k){let d=await db();return new Promise((ok,no)=>{let r=d.transaction('photos').objectStore('photos').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function del(k){let d=await db();d.transaction('photos','readwrite').objectStore('photos').delete(k)}function compress(f){return new Promise((ok,no)=>{let im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{let max=1280,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);b?ok(b):no()},'image/jpeg',.8)};im.onerror=no;im.src=u})}function promptText(){let type=$('#type').value,extra=$('#foods').value.trim();return `請幫我分析這張${type}照片，先辨識你看得到的食物，再用繁體中文給我自然一點、像聊天的回饋。請包含：\n1. 你看見哪些食物；不確定的請明說。\n2. 這餐低碳程度 1-10 分。\n3. 蛋白質、蔬菜、澱粉、糖分是否大致足夠。\n4. 這餐做得好的地方。\n5. 哪裡可能不足或需要留意。\n6. 下一餐怎麼補，給具體食物建議。\n7. 如果照片無法判斷份量、醬料或飲料是否加糖，請直接問我，不要猜。\n\n我的補充：${extra||'目前沒有，請先依照片判斷。'}\n\n不要要求極端節食，也不要把照片估算說成精準營養數字。`; }async function shareToChatGPT(){let text=promptText();if(!blob){await navigator.clipboard.writeText(text);toast('已複製提示，請到 ChatGPT 貼上並上傳照片');window.open('https://chatgpt.com/','_blank');return}let file=new File([blob],'meal.jpg',{type:'image/jpeg'});try{if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){await navigator.share({title:'低碳飲食分析',text,files:[file]});}else{await navigator.clipboard.writeText(text);toast('裝置不支援照片分享，已複製提示');window.open('https://chatgpt.com/','_blank')}}catch(e){if(e.name!=='AbortError'){await navigator.clipboard.writeText(text);toast('已複製提示，請改到 ChatGPT 手動貼上')}}}async function pick(f){if(!f)return;$('#photoMsg').textContent='正在處理照片…';try{blob=await compress(f);let p=$('#preview');p.src=URL.createObjectURL(blob);p.style.display='block';$('#photoMsg').textContent=`照片已準備儲存（約 ${Math.round(blob.size/1024)} KB）`;}catch{$('#photoMsg').textContent='照片處理失敗，請再試一次。'}}function score(s){let t=(s||'').toLowerCase(),has=a=>a.some(x=>t.includes(x)),p=has(['雞','魚','牛','豬','蛋','豆腐','豆漿','蝦','肉']),v=has(['菜','花椰','菇','菠菜','高麗','青江','生菜']),sug=has(['蛋糕','甜','糖','可樂','奶茶','果汁']),carb=has(['飯','麵','麵包','吐司','粥','餅','地瓜']);return Math.max(20,Math.min(100,72+(p?10:0)+(v?10:0)-(carb?7:0)-(sug?20:0)))}function save(){localStorage.setItem(META,JSON.stringify(meta));render()}async function render(){let arr=meta.meals[DAY]||[],list=$('#list');list.innerHTML='';for(let m of arr){let ph=m.photoKey?await get(m.photoKey):null,src=ph?URL.createObjectURL(ph):'',row=document.createElement('div');row.innerHTML=`<div class="meal">${src?`<img src="${src}">`:'<div>🥗</div>'}<div><h3>${m.type}</h3><p>${m.foods||'照片紀錄'}</p></div><button class="danger" data-id="${m.id}">刪除</button></div><div class="feedback">${m.aiNote?`<b>ChatGPT 分析重點</b><br>${m.aiNote.replace(/\n/g,'<br>')}`:'<span class="small">尚未貼回 ChatGPT 分析，可之後補上。</span>'}</div>`;list.append(row)}$('#cnt').textContent=arr.length;$('#avg').textContent=arr.length?Math.round(arr.reduce((n,m)=>n+score(m.foods),0)/arr.length):'--';let w=meta.water[DAY]||0;$('#wc').textContent=w;$('#water').innerHTML=Array.from({length:8},(_,i)=>`<button class="${i<w?'on':''}" data-w="${i+1}">${i<w?'💧':'🥛'} ${i+1}</button>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{let a=meta.meals[DAY],m=a.find(x=>x.id===b.dataset.id);if(m?.photoKey)await del(m.photoKey);meta.meals[DAY]=a.filter(x=>x.id!==b.dataset.id);save()});document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{meta.water[DAY]=+b.dataset.w;save()})}$('#add').onclick=()=>{blob=null;$('#preview').style.display='none';$('#foods').value='';$('#aiNote').value='';$('#dlg').showModal()};$('#cancel').onclick=()=>$('#dlg').close();$('#camera').onchange=e=>pick(e.target.files[0]);$('#gallery').onchange=e=>pick(e.target.files[0]);$('#shareAI').onclick=shareToChatGPT;$('#copyPrompt').onclick=async()=>{await navigator.clipboard.writeText(promptText());toast('分析提示已複製')};$('#form').onsubmit=async e=>{e.preventDefault();let id=crypto.randomUUID?crypto.randomUUID():Date.now().toString(),key=blob?'p_'+id:null;if(blob)await put(key,blob);meta.meals[DAY]??=[];meta.meals[DAY].push({id,type:$('#type').value,foods:$('#foods').value.trim(),aiNote:$('#aiNote').value.trim(),photoKey:key});save();$('#dlg').close();$('#camera').value='';$('#gallery').value=''};render();</script></body></html>
