<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f8f3"><title>每日低碳飲食日記 V7</title><style>:root{--g:#287447;--bg:#f4f7f3;--line:#dce5dd;--muted:#69766d;--ink:#203027;--blue:#f4f9ff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}.app{max-width:900px;margin:auto;padding:18px 14px 80px}h1{font-size:24px}.ver{background:#e9f4ec;color:var(--g);border-radius:99px;padding:4px 8px;font-size:12px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.m{background:#fafcfa;border:1px solid var(--line);border-radius:13px;padding:11px}.m b{font-size:22px}.m small,.small{display:block;color:var(--muted);font-size:12px}button,.pick{border:0;border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer}.primary,.pick{background:var(--g);color:#fff}.pick.alt{background:#edf3ff;color:#27577e}.aiBtn{background:#111;color:#fff;width:100%}.secondary{background:#edf2ee}.add{width:100%;background:#f7fbf8;border:1px dashed #9dbba6;color:var(--g)}select,textarea{width:100%;padding:10px;border:1px solid #ccd8ce;border-radius:10px;font:inherit;background:#fff}label{font-size:13px;color:var(--muted);display:block;margin:8px 0 4px}.meal{display:grid;grid-template-columns:80px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);padding:10px;border-radius:14px;margin:8px 0}.meal img{width:80px;height:68px;object-fit:cover;border-radius:10px}.meal h3,.meal p{margin:2px 0}.danger{background:none;color:#a33}.feedback{background:#fbfdfb;border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 12px;line-height:1.65;white-space:pre-wrap}.water button{margin:3px;background:#eef4ef}.water button.on{background:#bfe1c8}dialog{width:min(620px,calc(100% - 16px));border:0;border-radius:20px;padding:0}dialog::backdrop{background:#13231966}.modal{padding:16px}.photo{text-align:center;border:1px dashed #9dbba6;border-radius:13px;padding:12px}.photo img{width:100%;max-height:260px;object-fit:cover;border-radius:10px;display:none;margin-bottom:10px}.photo input{display:none}.photoActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.analyzeBox{margin-top:12px;padding:12px;background:var(--blue);border:1px solid #d8e7f6;border-radius:14px}.result{display:none;margin-top:10px;background:#fff;border:1px solid #d9e0e5;border-radius:12px;padding:12px;line-height:1.65;white-space:pre-wrap}.result.loading{display:block;background:#fff8e6}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2d24;color:#fff;padding:10px 14px;border-radius:99px;display:none;z-index:20}@media(max-width:600px){.photoActions{grid-template-columns:1fr 1fr}.actions button{flex:1}.meal{grid-template-columns:70px 1fr}.meal img{width:70px;height:60px}.meal .danger{grid-column:2}}</style></head><body><main class="app"><h1>🥗 每日低碳飲食日記 <span class="ver">AI 直連版 V7</span></h1><p id="date" class="small"></p><div class="metrics"><div class="m"><b id="cnt">0</b><small>今日餐次</small></div><div class="m"><b id="avg">--</b><small>低碳自評</small></div><div class="m"><b id="wc">0</b><small>杯水</small></div></div><section class="card"><h2>今日餐點</h2><div id="list"></div><button class="add" id="add">＋ 新增一餐</button></section><section class="card"><h2>💧 喝水</h2><div id="water" class="water"></div></section></main><dialog id="dlg"><div class="modal"><h2>新增餐點</h2><form id="form"><div class="photo"><img id="preview"><div class="photoActions"><label class="pick" for="camera">📷 拍照</label><label class="pick alt" for="gallery">🖼️ 圖庫</label></div><input id="camera" type="file" accept="image/*" capture="environment"><input id="gallery" type="file" accept="image/*"><div id="photoMsg" class="small">拍照或選圖後，就可以直接讓 AI 分析。</div></div><label>餐別</label><select id="type"><option>早餐</option><option>午餐</option><option>晚餐</option><option>點心</option><option>飲料</option></select><label>補充說明（可空白）</label><textarea id="foods" rows="2" placeholder="照片看不出的再補充，例如：無糖豆漿、醬汁沒有糖。"></textarea><div class="analyzeBox"><button type="button" class="aiBtn" id="analyze">🤖 AI 直接分析這餐</button><div id="aiResult" class="result"></div><p class="small">AI 會辨識照片並提供低碳分數、蛋白質、蔬菜、澱粉、糖分、熱量粗估與下一餐建議。照片估算仍可能有誤。</p></div><label>AI 分析結果（可手動修正）</label><textarea id="aiNote" rows="7" placeholder="AI 分析後會自動填入；你可以修改再儲存。"></textarea><div class="actions"><button type="button" class="secondary" id="cancel">取消</button><button class="primary" type="submit">儲存餐點</button></div></form></div></dialog><div class="toast" id="toast"></div><script>const WORKER='https://lowcarb-diet-ai.safecar7249.workers.dev/';const DAY=new Date().toLocaleDateString('sv-SE'),META='lowcarb_plus_meta',DB='lowcarb_plus_photos';let meta=JSON.parse(localStorage.getItem(META)||'{"meals":{},"water":{}}'),blob=null;const $=s=>document.querySelector(s);$('#date').textContent=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'});function toast(t){let x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}function db(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function put(k,v){let d=await db();return new Promise((ok,no)=>{let t=d.transaction('photos','readwrite');t.objectStore('photos').put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})}async function get(k){let d=await db();return new Promise((ok,no)=>{let r=d.transaction('photos').objectStore('photos').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function del(k){let d=await db();d.transaction('photos','readwrite').objectStore('photos').delete(k)}function compress(f){return new Promise((ok,no)=>{let im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{let s=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);b?ok(b):no()},'image/jpeg',.76)};im.onerror=no;im.src=u})}function dataUrl(b){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(b)})}async function pick(f){if(!f)return;$('#photoMsg').textContent='正在處理照片…';try{blob=await compress(f);let p=$('#preview');p.src=URL.createObjectURL(blob);p.style.display='block';$('#photoMsg').textContent='照片已準備好，現在可直接按「AI 直接分析這餐」。';$('#aiResult').style.display='none';$('#aiNote').value=''}catch{$('#photoMsg').textContent='照片處理失敗，請再試一次。'}}async function analyze(){if(!blob){toast('請先拍照或選照片');return}let box=$('#aiResult');box.className='result loading';box.textContent='🤖 AI 正在看照片並整理建議，請稍候…';$('#analyze').disabled=true;try{let image=await dataUrl(blob),res=await fetch(WORKER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image,mealType:$('#type').value,note:$('#foods').value.trim()})}),j=await res.json();if(!res.ok||!j.ok)throw new Error(j.error||'AI 分析失敗');let text=j.analysis||'AI 沒有回傳內容';box.className='result';box.textContent=text;box.style.display='block';$('#aiNote').value=text;toast('AI 分析完成')}catch(e){box.className='result';box.style.display='block';let msg=e.message||'AI 分析失敗';box.textContent='分析失敗：'+msg+'\n\n若訊息提到 Meta License / agreement，表示第一次使用 Vision 模型需要先接受授權。';}finally{$('#analyze').disabled=false}}function score(s){let t=s||'',p=/雞|魚|牛|豬|蛋|豆腐|豆漿|蝦|肉/.test(t),v=/菜|花椰|菇|菠菜|高麗|生菜/.test(t),c=/飯|麵|吐司|粥|餅|地瓜/.test(t),g=/甜|糖|可樂|奶茶|果汁/.test(t);return Math.max(20,Math.min(100,72+(p?10:0)+(v?10:0)-(c?7:0)-(g?20:0)))}function save(){localStorage.setItem(META,JSON.stringify(meta));render()}async function render(){let a=meta.meals[DAY]||[],l=$('#list');l.innerHTML='';for(let m of a){let ph=m.photoKey?await get(m.photoKey):null,src=ph?URL.createObjectURL(ph):'',r=document.createElement('div');r.innerHTML=`<div class="meal">${src?`<img src="${src}">`:'🥗'}<div><h3>${m.type}</h3><p>${m.foods||'照片紀錄'}</p></div><button class="danger" data-id="${m.id}">刪除</button></div>${m.aiNote?`<div class="feedback"><b>AI 分析</b>\n${m.aiNote}</div>`:''}`;l.append(r)}$('#cnt').textContent=a.length;$('#avg').textContent=a.length?Math.round(a.reduce((n,m)=>n+score(m.foods),0)/a.length):'--';let w=meta.water[DAY]||0;$('#wc').textContent=w;$('#water').innerHTML=Array.from({length:8},(_,i)=>`<button class="${i<w?'on':''}" data-w="${i+1}">${i<w?'💧':'🥛'} ${i+1}</button>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{let a=meta.meals[DAY],m=a.find(x=>x.id===b.dataset.id);if(m?.photoKey)await del(m.photoKey);meta.meals[DAY]=a.filter(x=>x.id!==b.dataset.id);save()});document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{meta.water[DAY]=+b.dataset.w;save()})}$('#add').onclick=()=>{blob=null;$('#preview').style.display='none';$('#foods').value='';$('#aiNote').value='';$('#aiResult').style.display='none';$('#dlg').showModal()};$('#cancel').onclick=()=>$('#dlg').close();$('#camera').onchange=e=>pick(e.target.files[0]);$('#gallery').onchange=e=>pick(e.target.files[0]);$('#analyze').onclick=analyze;$('#form').onsubmit=async e=>{e.preventDefault();let id=crypto.randomUUID?crypto.randomUUID():Date.now().toString(),key=blob?'p_'+id:null;if(blob)await put(key,blob);meta.meals[DAY]??=[];meta.meals[DAY].push({id,type:$('#type').value,foods:$('#foods').value.trim(),aiNote:$('#aiNote').value.trim(),photoKey:key});save();$('#dlg').close()};render();</script></body></html>
