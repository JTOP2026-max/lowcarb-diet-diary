<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f8f3"><title>每日低碳飲食日記</title><style>:root{--g:#287447;--bg:#f4f7f3;--line:#dce5dd;--muted:#69766d;--soft:#f7fbf8;--blue:#eef6ff;--warn:#fff8e6}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:var(--bg);color:#203027}.app{max-width:900px;margin:auto;padding:18px 14px 80px}h1{font-size:25px;margin:4px 0}h2{font-size:19px}p{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 28px #25452d0b}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.m{background:#fafcfa;border:1px solid var(--line);border-radius:13px;padding:11px}.m b{font-size:22px}.m small{display:block;color:var(--muted)}button,.pick{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}.primary,.pick{background:var(--g);color:#fff}.pick.alt{background:#edf3ff;color:#27577e;border:1px solid #cbdced}.add{width:100%;background:var(--soft);border:1px dashed #9dbba6;color:var(--g)}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd8ce;border-radius:10px;font:inherit;background:#fff}label{font-size:13px;color:var(--muted);display:block;margin:8px 0 4px}.meal{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);padding:10px;border-radius:14px;margin:8px 0}.meal img{width:86px;height:72px;object-fit:cover;border-radius:10px}.meal h3,.meal p{margin:2px 0}.score{color:var(--g);font-weight:800}.danger{background:none;color:#a33}.feedback{margin:8px 0 14px 96px;background:#fbfdfb;border:1px solid var(--line);border-radius:14px;padding:12px;line-height:1.65;font-size:14px}.feedback b{color:#203027}.feedback ul{margin:6px 0 0;padding-left:18px}.tag{display:inline-block;background:#e9f4ec;color:var(--g);padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800;margin-right:5px}.aiBox{background:#f7fbff;border:1px solid #cfe1f3;border-radius:14px;padding:12px;margin-top:12px;line-height:1.65}.aiBox.loading{background:var(--warn)}.aiBox ul{margin:5px 0 10px;padding-left:18px}.small{font-size:12px;color:var(--muted)}dialog{width:min(640px,calc(100% - 20px));border:0;border-radius:18px;padding:0}dialog::backdrop{background:#13231966}.modal{padding:17px}.photo{text-align:center;border:1px dashed #9dbba6;border-radius:13px;padding:12px}.photo img{width:100%;max-height:260px;object-fit:cover;border-radius:10px;display:none;margin-bottom:10px}.photo input{display:none}.photoActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.secondary{background:#edf2ee}.notice{font-size:13px;color:var(--muted);line-height:1.6}.water button{margin:3px;background:#eef4ef}.water button.on{background:#bfe1c8}.ai{line-height:1.7;border-left:4px solid var(--g);padding-left:12px}.ai ul{padding-left:18px}.hintbox{background:var(--blue);border:1px solid #d8e7f6;border-radius:12px;padding:10px;margin-top:10px;color:#36596f}.settings{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}@media(max-width:600px){.meal{grid-template-columns:72px 1fr}.meal img{width:72px;height:62px}.meal .danger{grid-column:2}.metrics{grid-template-columns:repeat(3,1fr)}.feedback{margin-left:0}.photoActions{grid-template-columns:1fr}}</style></head><body><main class="app"><h1>🥗 每日低碳飲食日記</h1><p id="date"></p><div class="metrics"><div class="m"><b id="cnt">0</b><small>今日餐次</small></div><div class="m"><b id="avg">--</b><small>低碳平均分</small></div><div class="m"><b id="wc">0</b><small>杯水</small></div></div><section class="card"><h2>今日餐點</h2><div id="list"></div><button class="add" id="add">＋ 新增一餐</button></section><section class="card"><h2>💧 喝水</h2><div class="water" id="water"></div></section><section class="card"><h2>🤖 今日分析</h2><div class="ai" id="summary">先新增一餐，AI 會先看照片，再由你補充看不清楚的部分。</div><div class="settings"><div class="small">AI 後端狀態：<span id="apiState">尚未連線</span></div><input id="apiUrl" placeholder="AI 後端網址（部署完成後只需設定一次）"><button class="secondary" id="saveApi" style="margin-top:8px">儲存 AI 後端網址</button></div><p class="notice">生活健康管理用途；照片辨識與營養估算仍可能有誤，建議把 AI 沒看清楚的食物或份量手動補上。</p></section></main><dialog id="dlg"><div class="modal"><h2>新增餐點</h2><form id="form"><div class="photo"><img id="preview"><div class="photoActions"><label class="pick" for="camera">📷 直接拍照</label><label class="pick alt" for="gallery">🖼️ 從圖庫選照片</label></div><input id="camera" type="file" accept="image/*" capture="environment"><input id="gallery" type="file" accept="image/*"><div class="notice" id="photoMsg">選好照片後，AI 會先幫你辨識食物；你再補充它沒看懂的地方。</div></div><label>餐別</label><select id="type"><option>早餐</option><option>午餐</option><option>晚餐</option><option>點心</option><option>飲料</option></select><div id="aiResult" class="aiBox" style="display:none"></div><label>AI 辨識＋我的補充（可修改）</label><textarea id="foods" rows="4" placeholder="AI 會先自動填入；若看錯、漏掉或份量不準，直接在這裡修正。"></textarea><div class="hintbox">建議流程：先讓 AI 看照片 → 看它辨識到什麼 → 你再把「份量、醬料、飲料是否無糖」等照片看不出的資訊補上 → 最後儲存。</div><div class="actions"><button type="button" class="secondary" id="reanalyze">重新 AI 分析</button><button type="button" class="secondary" id="cancel">取消</button><button class="primary" type="submit">儲存餐點</button></div></form></div></dialog><script>const DAY=new Date().toLocaleDateString('sv-SE'),META='lowcarb_v3_meta',DB='lowcarb_v3_photos',APIKEY='lowcarb_api_url';let meta=JSON.parse(localStorage.getItem(META)||'{"meals":{},"water":{}}'),blob=null,lastAI=null;const $=s=>document.querySelector(s);$('#date').textContent=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'});function apiBase(){let saved=(localStorage.getItem(APIKEY)||'').trim();if(saved)return saved.replace(/\/$/,'');if(location.hostname.endsWith('vercel.app'))return location.origin;return ''}function refreshApiState(){let b=apiBase();$('#apiUrl').value=localStorage.getItem(APIKEY)||'';$('#apiState').textContent=b?'已設定 ✅':'尚未連線'}$('#saveApi').onclick=()=>{let v=$('#apiUrl').value.trim();localStorage.setItem(APIKEY,v);refreshApiState();alert('AI 後端網址已儲存');};function db(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function put(k,v){let d=await db();return new Promise((ok,no)=>{let t=d.transaction('photos','readwrite');t.objectStore('photos').put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})}async function get(k){let d=await db();return new Promise((ok,no)=>{let r=d.transaction('photos').objectStore('photos').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function del(k){let d=await db();d.transaction('photos','readwrite').objectStore('photos').delete(k)}function compress(f){return new Promise((ok,no)=>{let im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{let max=1280,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);b?ok(b):no()},'image/jpeg',.78)};im.onerror=no;im.src=u})}function blobToDataURL(b){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(b)})}function safeArr(a){return Array.isArray(a)?a:[]}function aiHtml(a){return `<div><span class="tag">${Number(a.score)||'--'} 分</span><span class="tag">AI 看圖</span></div><p><b>我看起來有：</b>${a.foods||'無法確定'}</p>${safeArr(a.good).length?`<b>做得好的地方</b><ul>${a.good.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}${safeArr(a.watch).length?`<b>要注意</b><ul>${a.watch.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}${safeArr(a.next).length?`<b>下一餐建議</b><ul>${a.next.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}${a.summary?`<p><b>整體：</b>${a.summary}</p>`:''}${safeArr(a.uncertain).length?`<div class="small">需要你幫忙確認：${a.uncertain.join('、')}</div>`:''}`}async function runAI(){if(!blob){$('#aiResult').style.display='block';$('#aiResult').innerHTML='請先拍照或從圖庫選照片。';return}let base=apiBase();if(!base){$('#aiResult').style.display='block';$('#aiResult').innerHTML='<b>AI 後端尚未連線。</b><br>照片可以先儲存，但要啟用真正的 AI 看圖，還差後端部署與 API Key 設定。';return}$('#aiResult').style.display='block';$('#aiResult').classList.add('loading');$('#aiResult').innerHTML='🤖 AI 正在看照片、辨識食物與整理建議…';try{let image=await blobToDataURL(blob),r=await fetch(base+'/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image,mealType:$('#type').value,manualText:$('#foods').value.trim()})}),j=await r.json();if(!r.ok)throw new Error(j.error||'AI 分析失敗');lastAI=j;$('#aiResult').classList.remove('loading');$('#aiResult').innerHTML=aiHtml(j);if(j.foods&&!$('#foods').value.trim())$('#foods').value=j.foods;}catch(e){$('#aiResult').classList.remove('loading');$('#aiResult').innerHTML='<b>AI 分析暫時失敗：</b>'+e.message+'<br><span class="small">你仍可以手動補充並儲存照片。</span>'}}function localScore(s){let t=(s||'').toLowerCase(),has=a=>a.some(x=>t.includes(x)),p=has(['雞','魚','牛','豬','蛋','豆腐','豆干','豆漿','蝦','肉','優格','起司']),v=has(['菜','花椰','菇','菠菜','高麗','青江','筍','生菜','番茄']),sug=has(['蛋糕','甜','糖','可樂','奶茶','果汁','蜂蜜']),carb=has(['飯','麵','麵包','吐司','粥','餅','地瓜','馬鈴薯']);return Math.max(20,Math.min(100,72+(p?10:0)+(v?10:0)-(carb?7:0)-(sug?20:0)))}function save(){localStorage.setItem(META,JSON.stringify(meta));render()}async function render(){let arr=meta.meals[DAY]||[],list=$('#list');list.innerHTML='';for(let m of arr){let ph=m.photoKey?await get(m.photoKey):null,src=ph?URL.createObjectURL(ph):'',score=m.ai?.score||localScore(m.foods),row=document.createElement('div');row.innerHTML=`<div class="meal">${src?`<img src="${src}">`:'<div>🥗</div>'}<div><h3>${m.type}</h3><p>${m.foods||'照片紀錄'}</p><span class="score">${score} 分</span></div><button class="danger" data-id="${m.id}">刪除</button></div><div class="feedback">${m.ai?aiHtml(m.ai):'<b>已儲存。</b><div class="small">這筆沒有 AI 看圖結果，可依文字內容自行補充。</div>'}</div>`;list.append(row)}$('#cnt').textContent=arr.length;$('#avg').textContent=arr.length?Math.round(arr.reduce((n,m)=>n+(Number(m.ai?.score)||localScore(m.foods)),0)/arr.length):'--';let w=meta.water[DAY]||0;$('#wc').textContent=w;$('#water').innerHTML=Array.from({length:8},(_,i)=>`<button class="${i<w?'on':''}" data-w="${i+1}">${i<w?'💧':'🥛'} ${i+1}</button>`).join('');let aiCount=arr.filter(x=>x.ai).length;$('#summary').innerHTML=!arr.length?'先新增一餐，AI 會先看照片，再由你補充看不清楚的部分。':`今天已紀錄 <b>${arr.length}</b> 餐，其中 <b>${aiCount}</b> 餐有 AI 看圖分析。<ul><li>如果 AI 漏看了醬料、飲料是否無糖、實際份量，請以你的手動補充為準。</li><li>一天的總結會以你最後儲存的文字＋AI 建議一起參考。</li></ul>`;document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{let a=meta.meals[DAY],m=a.find(x=>x.id===b.dataset.id);if(m?.photoKey)await del(m.photoKey);meta.meals[DAY]=a.filter(x=>x.id!==b.dataset.id);save()});document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{meta.water[DAY]=+b.dataset.w;save()})}$('#add').onclick=()=>{blob=null;lastAI=null;$('#preview').style.display='none';$('#foods').value='';$('#aiResult').style.display='none';$('#camera').value='';$('#gallery').value='';$('#dlg').showModal()};$('#cancel').onclick=()=>$('#dlg').close();$('#reanalyze').onclick=runAI;async function picked(input){let f=input.files[0];if(!f)return;$('#photoMsg').textContent='正在壓縮照片…';try{blob=await compress(f);let u=URL.createObjectURL(blob),p=$('#preview');p.src=u;p.style.display='block';$('#photoMsg').textContent=`照片已準備（約 ${Math.round(blob.size/1024)} KB），接著由 AI 先辨識。`;await runAI()}catch{$('#photoMsg').textContent='照片處理失敗，請再試一次。'}}$('#camera').onchange=e=>picked(e.target);$('#gallery').onchange=e=>picked(e.target);$('#type').onchange=()=>{if(blob)runAI()};$('#form').onsubmit=async e=>{e.preventDefault();let id=crypto.randomUUID?crypto.randomUUID():Date.now().toString(),key=blob?'p_'+id:null;if(blob)await put(key,blob);meta.meals[DAY]??=[];meta.meals[DAY].push({id,type:$('#type').value,foods:$('#foods').value.trim(),photoKey:key,ai:lastAI});save();$('#dlg').close()};refreshApiState();render();</script></body></html>
