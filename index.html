<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f8f3"><title>每日低碳飲食日記</title><style>:root{--g:#287447;--bg:#f4f7f3;--line:#dce5dd;--muted:#69766d}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:var(--bg);color:#203027}.app{max-width:900px;margin:auto;padding:18px 14px 80px}h1{font-size:25px;margin:4px 0}p{color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 28px #25452d0b}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.m{background:#fafcfa;border:1px solid var(--line);border-radius:13px;padding:11px}.m b{font-size:22px}.m small{display:block;color:var(--muted)}button,.pick{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}.primary,.pick{background:var(--g);color:#fff}.add{width:100%;background:#f7fbf8;border:1px dashed #9dbba6;color:var(--g)}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd8ce;border-radius:10px;font:inherit;background:white}label{font-size:13px;color:var(--muted);display:block;margin:8px 0 4px}.meal{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);padding:10px;border-radius:14px;margin:8px 0}.meal img{width:86px;height:72px;object-fit:cover;border-radius:10px}.meal h3,.meal p{margin:2px 0}.score{color:var(--g);font-weight:800}.danger{background:none;color:#a33}dialog{width:min(600px,calc(100% - 20px));border:0;border-radius:18px;padding:0}dialog::backdrop{background:#13231966}.modal{padding:17px}.photo{text-align:center;border:1px dashed #9dbba6;border-radius:13px;padding:10px}.photo img{width:100%;max-height:260px;object-fit:cover;border-radius:10px;display:none}.photo input{display:none}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.secondary{background:#edf2ee}.notice{font-size:13px;color:var(--muted);line-height:1.6}.water button{margin:3px;background:#eef4ef}.water button.on{background:#bfe1c8}.ai{line-height:1.65;border-left:4px solid var(--g);padding-left:12px}@media(max-width:600px){.meal{grid-template-columns:72px 1fr}.meal img{width:72px;height:62px}.meal .danger{grid-column:2}.metrics{grid-template-columns:repeat(3,1fr)}}</style></head><body><main class="app"><h1>🥗 每日低碳飲食日記</h1><p id="date"></p><div class="metrics"><div class="m"><b id="cnt">0</b><small>今日餐次</small></div><div class="m"><b id="avg">--</b><small>低碳平均分</small></div><div class="m"><b id="wc">0</b><small>杯水</small></div></div><section class="card"><h2>今日餐點</h2><div id="list"></div><button class="add" id="add">＋ 拍照 / 新增一餐</button></section><section class="card"><h2>💧 喝水</h2><div class="water" id="water"></div></section><section class="card"><h2>🤖 今日分析</h2><div class="ai" id="summary">先新增一餐，我會依餐點內容整理今天的低碳方向。</div><p class="notice">生活健康管理用途；照片與營養估算不能取代醫療或營養專業。</p></section></main><dialog id="dlg"><div class="modal"><h2>新增餐點</h2><form id="form"><div class="photo"><img id="preview"><label class="pick" for="photo">📷 拍照 / 選照片</label><input id="photo" type="file" accept="image/*" capture="environment"><div class="notice" id="photoMsg">照片會自動壓縮後儲存在這台裝置。</div></div><label>餐別</label><select id="type"><option>早餐</option><option>午餐</option><option>晚餐</option><option>點心</option><option>飲料</option></select><label>吃了什麼？（可先只拍照）</label><textarea id="foods" rows="3" placeholder="例：雞腿、蛋、青菜、半碗飯"></textarea><div class="actions"><button type="button" class="secondary" id="cancel">取消</button><button class="primary" type="submit">儲存餐點</button></div></form></div></dialog><script>const DAY=new Date().toLocaleDateString('sv-SE'),META='lowcarb_v2_meta',DB='lowcarb_v2_photos';let meta=JSON.parse(localStorage.getItem(META)||'{"meals":{},"water":{}}'),blob=null;document.querySelector('#date').textContent=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'});function db(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function put(k,v){let d=await db();return new Promise((ok,no)=>{let t=d.transaction('photos','readwrite');t.objectStore('photos').put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})}async function get(k){let d=await db();return new Promise((ok,no)=>{let r=d.transaction('photos').objectStore('photos').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function del(k){let d=await db();d.transaction('photos','readwrite').objectStore('photos').delete(k)}function compress(f){return new Promise((ok,no)=>{let im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{let max=1280,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);b?ok(b):no()},'image/jpeg',.78)};im.onerror=no;im.src=u})}function analysis(s){let t=(s||'').toLowerCase(),has=a=>a.some(x=>t.includes(x)),protein=has(['雞','魚','牛','豬','蛋','豆腐','豆漿','蝦','肉']),veg=has(['菜','花椰','菇','菠菜','高麗','青江','筍']),carb=has(['飯','麵','麵包','粥','餅','地瓜','馬鈴薯']),sugar=has(['蛋糕','甜','糖','可樂','奶茶','果汁']);let score=70+(protein?10:0)+(veg?10:0)-(carb?10:0)-(sugar?20:0);return{score:Math.max(20,Math.min(100,score)),protein,veg,carb,sugar}}function save(){localStorage.setItem(META,JSON.stringify(meta));render()}async function render(){let arr=meta.meals[DAY]||[],list=document.querySelector('#list');list.innerHTML='';for(let m of arr){let a=analysis(m.foods),ph=m.photoKey?await get(m.photoKey):null,row=document.createElement('div');row.className='meal';let src=ph?URL.createObjectURL(ph):'';row.innerHTML=`${src?`<img src="${src}">`:'<div>🥗</div>'}<div><h3>${m.type}</h3><p>${m.foods||'照片紀錄'}</p><span class="score">${a.score} 分</span></div><button class="danger" data-id="${m.id}">刪除</button>`;list.append(row)}document.querySelector('#cnt').textContent=arr.length;document.querySelector('#avg').textContent=arr.length?Math.round(arr.reduce((n,m)=>n+analysis(m.foods).score,0)/arr.length):'--';let w=meta.water[DAY]||0;document.querySelector('#wc').textContent=w;document.querySelector('#water').innerHTML=Array.from({length:8},(_,i)=>`<button class="${i<w?'on':''}" data-w="${i+1}">${i<w?'💧':'🥛'} ${i+1}</button>`).join('');let all=arr.map(x=>analysis(x.foods));document.querySelector('#summary').innerHTML=!arr.length?'先新增一餐，我會依餐點內容整理今天的低碳方向。':`今天已紀錄 <b>${arr.length}</b> 餐。${all.filter(x=>x.protein).length<arr.length?' 蛋白質有些餐次可能不足。':' 蛋白質方向不錯。'}${all.filter(x=>x.veg).length<2?' 建議下一餐增加一份蔬菜。':' 蔬菜攝取表現不錯。'}${all.some(x=>x.sugar)?' 今天有甜食/含糖飲料訊號，可留意份量。':''}`;document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{let a=meta.meals[DAY],m=a.find(x=>x.id===b.dataset.id);if(m?.photoKey)await del(m.photoKey);meta.meals[DAY]=a.filter(x=>x.id!==b.dataset.id);save()});document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{meta.water[DAY]=+b.dataset.w;save()})}document.querySelector('#add').onclick=()=>{blob=null;document.querySelector('#preview').style.display='none';document.querySelector('#foods').value='';document.querySelector('#dlg').showModal()};document.querySelector('#cancel').onclick=()=>document.querySelector('#dlg').close();document.querySelector('#photo').onchange=async e=>{let f=e.target.files[0];if(!f)return;document.querySelector('#photoMsg').textContent='正在壓縮照片…';try{blob=await compress(f);let u=URL.createObjectURL(blob),p=document.querySelector('#preview');p.src=u;p.style.display='block';document.querySelector('#photoMsg').textContent=`照片已準備儲存（約 ${Math.round(blob.size/1024)} KB）`;}catch{document.querySelector('#photoMsg').textContent='照片處理失敗，請再試一次。'}};document.querySelector('#form').onsubmit=async e=>{e.preventDefault();let id=crypto.randomUUID?crypto.randomUUID():Date.now().toString(),key=blob?'p_'+id:null;if(blob)await put(key,blob);meta.meals[DAY]??=[];meta.meals[DAY].push({id,type:document.querySelector('#type').value,foods:document.querySelector('#foods').value.trim(),photoKey:key});save();document.querySelector('#dlg').close();document.querySelector('#photo').value=''};render();</script></body></html>
