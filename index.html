<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f8f3"><title>每日低碳飲食日記</title><style>:root{--g:#287447;--bg:#f4f7f3;--line:#dce5dd;--muted:#69766d;--soft:#f7fbf8;--blue:#eef6ff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:var(--bg);color:#203027}.app{max-width:900px;margin:auto;padding:18px 14px 80px}h1{font-size:25px;margin:4px 0}h2{font-size:19px}p{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 28px #25452d0b}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.m{background:#fafcfa;border:1px solid var(--line);border-radius:13px;padding:11px}.m b{font-size:22px}.m small{display:block;color:var(--muted)}button,.pick{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}.primary,.pick{background:var(--g);color:#fff}.pick.alt{background:#edf3ff;color:#27577e;border:1px solid #cbdced}.add{width:100%;background:var(--soft);border:1px dashed #9dbba6;color:var(--g)}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd8ce;border-radius:10px;font:inherit;background:#fff}label{font-size:13px;color:var(--muted);display:block;margin:8px 0 4px}.meal{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);padding:10px;border-radius:14px;margin:8px 0}.meal img{width:86px;height:72px;object-fit:cover;border-radius:10px}.meal h3,.meal p{margin:2px 0}.score{color:var(--g);font-weight:800}.danger{background:none;color:#a33}.feedback{margin:8px 0 14px 96px;background:#fbfdfb;border:1px solid var(--line);border-radius:14px;padding:12px;line-height:1.65;font-size:14px}.feedback b{color:#203027}.feedback ul{margin:6px 0 0;padding-left:18px}.tag{display:inline-block;background:#e9f4ec;color:var(--g);padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800;margin-right:5px}dialog{width:min(600px,calc(100% - 20px));border:0;border-radius:18px;padding:0}dialog::backdrop{background:#13231966}.modal{padding:17px}.photo{text-align:center;border:1px dashed #9dbba6;border-radius:13px;padding:12px}.photo img{width:100%;max-height:260px;object-fit:cover;border-radius:10px;display:none;margin-bottom:10px}.photo input{display:none}.photoActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.secondary{background:#edf2ee}.notice{font-size:13px;color:var(--muted);line-height:1.6}.water button{margin:3px;background:#eef4ef}.water button.on{background:#bfe1c8}.ai{line-height:1.7;border-left:4px solid var(--g);padding-left:12px}.ai ul{padding-left:18px}.hintbox{background:var(--blue);border:1px solid #d8e7f6;border-radius:12px;padding:10px;margin-top:10px;color:#36596f}@media(max-width:600px){.meal{grid-template-columns:72px 1fr}.meal img{width:72px;height:62px}.meal .danger{grid-column:2}.metrics{grid-template-columns:repeat(3,1fr)}.feedback{margin-left:0}.photoActions{grid-template-columns:1fr}}</style></head><body><main class="app"><h1>🥗 每日低碳飲食日記</h1><p id="date"></p><div class="metrics"><div class="m"><b id="cnt">0</b><small>今日餐次</small></div><div class="m"><b id="avg">--</b><small>低碳平均分</small></div><div class="m"><b id="wc">0</b><small>杯水</small></div></div><section class="card"><h2>今日餐點</h2><div id="list"></div><button class="add" id="add">＋ 新增一餐</button></section><section class="card"><h2>💧 喝水</h2><div class="water" id="water"></div></section><section class="card"><h2>🤖 今日分析</h2><div class="ai" id="summary">先新增一餐，我會依餐點內容整理今天的低碳方向。</div><p class="notice">生活健康管理用途；目前文字分析可提供低碳方向與飲食建議，照片本身的 AI 影像辨識仍需安全後端才能啟用。</p></section></main><dialog id="dlg"><div class="modal"><h2>新增餐點</h2><form id="form"><div class="photo"><img id="preview"><div class="photoActions"><label class="pick" for="camera">📷 直接拍照</label><label class="pick alt" for="gallery">🖼️ 從圖庫選照片</label></div><input id="camera" type="file" accept="image/*" capture="environment"><input id="gallery" type="file" accept="image/*"><div class="notice" id="photoMsg">可直接拍照，也可以從手機圖庫選擇既有照片；照片會自動壓縮後儲存在這台裝置。</div></div><label>餐別</label><select id="type"><option>早餐</option><option>午餐</option><option>晚餐</option><option>點心</option><option>飲料</option></select><label>吃了什麼？</label><textarea id="foods" rows="3" placeholder="例：全麥吐司、雞蛋、藍莓、草莓、無糖豆漿"></textarea><div class="hintbox">填入食物內容後，儲存時會自動產生較完整的回饋：這餐做得好的地方、可能不足、低碳注意事項，以及下一餐怎麼補。</div><div class="actions"><button type="button" class="secondary" id="cancel">取消</button><button class="primary" type="submit">儲存並分析</button></div></form></div></dialog><script>const DAY=new Date().toLocaleDateString('sv-SE'),META='lowcarb_v2_meta',DB='lowcarb_v2_photos';let meta=JSON.parse(localStorage.getItem(META)||'{"meals":{},"water":{}}'),blob=null;const $=s=>document.querySelector(s);$('#date').textContent=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'});function db(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function put(k,v){let d=await db();return new Promise((ok,no)=>{let t=d.transaction('photos','readwrite');t.objectStore('photos').put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})}async function get(k){let d=await db();return new Promise((ok,no)=>{let r=d.transaction('photos').objectStore('photos').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function del(k){let d=await db();d.transaction('photos','readwrite').objectStore('photos').delete(k)}function compress(f){return new Promise((ok,no)=>{let im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{let max=1280,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);b?ok(b):no()},'image/jpeg',.78)};im.onerror=no;im.src=u})}function analyze(s){let t=(s||'').toLowerCase(),has=a=>a.some(x=>t.includes(x)),protein=has(['雞','魚','牛','豬','蛋','豆腐','豆干','豆漿','蝦','肉','優格','起司']),veg=has(['菜','花椰','菇','菠菜','高麗','青江','筍','生菜','番茄']),fruit=has(['藍莓','草莓','莓','蘋果','芭樂','奇異果','橘','香蕉','水果']),carb=has(['飯','麵','麵包','吐司','粥','餅','地瓜','馬鈴薯','燕麥']),whole=has(['全麥','燕麥','糙米']),sugar=has(['蛋糕','甜','糖','可樂','奶茶','果汁','蜂蜜']),drink=has(['豆漿','牛奶','咖啡','茶','飲料']);let score=72+(protein?10:0)+(veg?10:0)+(fruit?3:0)+(whole?4:0)-(carb&&!whole?10:0)-(sugar?20:0);return{score:Math.max(20,Math.min(100,score)),protein,veg,fruit,carb,whole,sugar,drink}}function feedback(m){let a=analyze(m.foods),good=[],watch=[],next=[];if(a.protein)good.push('有蛋白質來源，對維持飽足感與肌肉量較有利。');else next.push('下一餐補一份蛋白質：蛋、雞肉、魚、豆腐或無糖豆漿都可以。');if(a.veg)good.push('有蔬菜，纖維與微量營養素方向不錯。');else next.push('建議下一餐增加至少 1 份非澱粉蔬菜。');if(a.fruit)good.push('有水果來源；莓果類通常較容易控制總糖量。');if(a.whole)good.push('澱粉若以全穀／全麥為主，通常比精製澱粉更理想。');if(a.carb&&!a.whole)watch.push('有精製澱粉訊號；低碳期間可留意份量，不一定要完全拿掉。');if(a.sugar)watch.push('有甜食或含糖飲料訊號，今天其他餐可避免再疊加糖分。');if(!a.sugar)good.push('目前沒有明顯含糖食物訊號，對低碳管理是加分。');if(a.score>=85)next.push('這餐整體很穩，下一餐維持蛋白質＋蔬菜的結構即可。');else if(a.score>=70)next.push('整體可以，再把蛋白質或蔬菜補齊會更完整。');else next.push('今天後續餐次可走「蛋白質＋大量蔬菜＋少量原型澱粉」把平衡拉回來。');return{a,html:`<div><span class="tag">${a.score} 分</span><span class="tag">低碳建議</span></div><b>這餐做得好的地方</b><ul>${good.map(x=>`<li>${x}</li>`).join('')||'<li>目前資訊較少，可再補充食物內容。</li>'}</ul>${watch.length?`<b>要注意</b><ul>${watch.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}<b>接下來怎麼吃</b><ul>${next.map(x=>`<li>${x}</li>`).join('')}</ul>`}}function save(){localStorage.setItem(META,JSON.stringify(meta));render()}async function render(){let arr=meta.meals[DAY]||[],list=$('#list');list.innerHTML='';for(let m of arr){let f=feedback(m),ph=m.photoKey?await get(m.photoKey):null,src=ph?URL.createObjectURL(ph):'',row=document.createElement('div');row.innerHTML=`<div class="meal">${src?`<img src="${src}">`:'<div>🥗</div>'}<div><h3>${m.type}</h3><p>${m.foods||'照片紀錄'}</p><span class="score">${f.a.score} 分</span></div><button class="danger" data-id="${m.id}">刪除</button></div><div class="feedback">${m.foods?f.html:'<b>照片已儲存。</b><div class="notice">目前尚未啟用真正的 AI 看圖辨識，因此只靠照片無法可靠判斷食物。你可以補上餐點文字，就能立即得到較完整建議。</div>'}</div>`;list.append(row)}$('#cnt').textContent=arr.length;$('#avg').textContent=arr.length?Math.round(arr.reduce((n,m)=>n+analyze(m.foods).score,0)/arr.length):'--';let w=meta.water[DAY]||0;$('#wc').textContent=w;$('#water').innerHTML=Array.from({length:8},(_,i)=>`<button class="${i<w?'on':''}" data-w="${i+1}">${i<w?'💧':'🥛'} ${i+1}</button>`).join('');let all=arr.map(x=>analyze(x.foods));$('#summary').innerHTML=!arr.length?'先新增一餐，我會依餐點內容整理今天的低碳方向。':`今天已紀錄 <b>${arr.length}</b> 餐，平均低碳分數約 <b>${Math.round(all.reduce((n,x)=>n+x.score,0)/all.length)}</b> 分。<ul><li>${all.filter(x=>x.protein).length<arr.length?'有些餐次蛋白質可能不足，下一餐可優先補蛋、肉、魚或豆製品。':'蛋白質整體方向不錯。'}</li><li>${all.filter(x=>x.veg).length<2?'今天蔬菜還可以再增加，建議至少再補一大份。':'蔬菜攝取目前表現不錯。'}</li><li>${all.some(x=>x.sugar)?'今天已有糖分訊號，後續飲料建議無糖。':'目前沒有明顯高糖訊號，可以維持。'}</li></ul>`;document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{let a=meta.meals[DAY],m=a.find(x=>x.id===b.dataset.id);if(m?.photoKey)await del(m.photoKey);meta.meals[DAY]=a.filter(x=>x.id!==b.dataset.id);save()});document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{meta.water[DAY]=+b.dataset.w;save()})}$('#add').onclick=()=>{blob=null;$('#preview').style.display='none';$('#foods').value='';$('#camera').value='';$('#gallery').value='';$('#photoMsg').textContent='可直接拍照，也可以從手機圖庫選擇既有照片；照片會自動壓縮後儲存在這台裝置。';$('#dlg').showModal()};$('#cancel').onclick=()=>$('#dlg').close();async function handlePhoto(f){if(!f)return;$('#photoMsg').textContent='正在壓縮照片…';try{blob=await compress(f);let u=URL.createObjectURL(blob),p=$('#preview');p.src=u;p.style.display='block';$('#photoMsg').textContent=`照片已準備儲存（約 ${Math.round(blob.size/1024)} KB）`;}catch{$('#photoMsg').textContent='照片處理失敗，請再試一次。'}}$('#camera').onchange=e=>handlePhoto(e.target.files[0]);$('#gallery').onchange=e=>handlePhoto(e.target.files[0]);$('#form').onsubmit=async e=>{e.preventDefault();let id=crypto.randomUUID?crypto.randomUUID():Date.now().toString(),key=blob?'p_'+id:null;if(blob)await put(key,blob);meta.meals[DAY]??=[];meta.meals[DAY].push({id,type:$('#type').value,foods:$('#foods').value.trim(),photoKey:key});save();$('#dlg').close()};render();</script></body></html>
